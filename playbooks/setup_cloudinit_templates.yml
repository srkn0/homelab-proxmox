---
- hosts: all
  become: true
  roles:
    - role: proxmox_cloudinit_template
      vars:
        cloudinit_storage: "vms"
        cloudinit_storage_path: "/mnt/zpool_nvme"
        cloudinit_user: "root"

        cloudinit_templates:
          - vmid: 8200
            name: "ubuntu-noble-template"
            image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
            checksum_url: "https://cloud-images.ubuntu.com/noble/current/SHA256SUMS"
            tags:
              - ubuntu-template
              - noble
              - cloudinit
            vendor_data: |
              #cloud-config
              runcmd:
                - apt-get update
                - apt-get install -y qemu-guest-agent
                - systemctl enable ssh
                - reboot

          - vmid: 8201
            name: "ubuntu-noble-template-k8s"
            image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
            checksum_url: "https://cloud-images.ubuntu.com/noble/current/SHA256SUMS"
            tags:
              - ubuntu-template
              - noble
              - cloudinit
              - kubernetes
            vendor_data: |
              #cloud-config
              runcmd:
                # Disable swap (required by kubelet)
                - swapoff -a
                - sed -i '/ swap / s/^/#/' /etc/fstab

                # Load required kernel modules
                - |
                  cat > /etc/modules-load.d/k8s.conf << EOF
                  overlay
                  br_netfilter
                  EOF
                - modprobe overlay
                - modprobe br_netfilter

                # Set sysctl parameters for Kubernetes
                - |
                  cat > /etc/sysctl.d/99-kubernetes.conf << EOF
                  # Bridge netfilter (required for iptables to see bridged traffic)
                  net.bridge.bridge-nf-call-iptables = 1
                  net.bridge.bridge-nf-call-ip6tables = 1

                  # IP forwarding (required for pod networking)
                  net.ipv4.ip_forward = 1

                  # Inotify limits (recommended for kubelet, etcd, nginx-ingress)
                  fs.inotify.max_user_instances = 8192
                  fs.inotify.max_user_watches = 524288

                  # Memory/process limits (recommended for Elasticsearch, many pods)
                  vm.max_map_count = 262144

                  # Reverse path filtering - strict mode for Calico CNI security
                  net.ipv4.conf.all.rp_filter = 1
                  net.ipv4.conf.default.rp_filter = 1

                  # Kernel keys (for secret management)
                  kernel.keys.root_maxbytes = 25000000
                  kernel.keys.root_maxkeys = 1000000

                  # Panic behavior (recommended for node recovery)
                  kernel.panic = 10
                  kernel.panic_on_oops = 1
                  vm.overcommit_memory = 1
                  vm.panic_on_oom = 0
                  EOF
                - sysctl --system

                # Install required packages
                - apt-get update
                - apt-get install -y qemu-guest-agent
                - systemctl enable ssh

                # Reboot to apply all changes
                - reboot

          - vmid: 8202
            name: "ubuntu-noble-template-nvidia-runtime-ai-dev"
            image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
            checksum_url: "https://cloud-images.ubuntu.com/noble/current/SHA256SUMS"
            tags:
              - ubuntu-template
              - noble
              - cloudinit
              - nvidia
              - openclaw
              - kind
            vendor_data: |
              #cloud-config
              runcmd:
                - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
                - curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
                - apt-get update
                - apt-get install -y qemu-guest-agent nvidia-dkms-550-server nvidia-utils-550-server nvidia-container-runtime curl unzip ca-certificates postgresql-client git
                - systemctl enable ssh

                # Docker
                - install -m 0755 -d /etc/apt/keyrings
                - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
                - chmod a+r /etc/apt/keyrings/docker.asc
                - |
                  cat <<EOF > /etc/apt/sources.list.d/docker.sources
                  Types: deb
                  URIs: https://download.docker.com/linux/ubuntu
                  Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
                  Components: stable
                  Signed-By: /etc/apt/keyrings/docker.asc
                  EOF
                - apt-get update
                - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
                - |
                  cat <<EOF > /etc/docker/daemon.json
                  {
                    "default-runtime": "nvidia",
                    "runtimes": {
                      "nvidia": {
                        "path": "nvidia-container-runtime",
                        "runtimeArgs": []
                      }
                    }
                  }
                  EOF
                - systemctl enable docker
                - systemctl start docker

                # kubectl
                - curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl
                - chmod +x ./kubectl
                - mv ./kubectl /usr/local/bin/kubectl

                # kind
                - |
                  if [ "$(uname -m)" = "x86_64" ]; then
                    curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
                    chmod +x /usr/local/bin/kind
                  fi

                # nodejs + pnpm
                - |
                  export HOME=/root
                  curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
                  apt-get install -y nodejs
                  corepack enable
                  corepack prepare pnpm@latest --activate
                  
                # openclaw
                - curl -fsSL --proto '=https' --tlsv1.2 https://openclaw.ai/install.sh | bash -s -- --no-onboard

                - reboot
